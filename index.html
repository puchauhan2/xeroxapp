<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(newFetch) {
              currentFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch of #<Window>') !== -1) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DocuDrop India - Shop QR Document Print & Xerox Desk</title>
    <meta name="description" content="Fast, secure QR-code based customer document upload and print queue system for Indian photocopy shops, cyber cafés, and document centers." />
